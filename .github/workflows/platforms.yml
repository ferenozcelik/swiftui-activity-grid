# visionOS and watchOS need their platform runtimes, which are slow to download and not
# always present on runners, so they build weekly and on demand instead of on every push.
name: Other platforms

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [visionOS, watchOS]
    steps:
      - uses: actions/checkout@v4
      - name: Download the platform
        run: xcodebuild -downloadPlatform ${{ matrix.platform }}
      - name: Build
        run: |
          xcodebuild build \
            -workspace SwiftUIActivityGrid.xcworkspace \
            -scheme SwiftUIActivityGrid \
            -destination 'generic/platform=${{ matrix.platform }} Simulator'
