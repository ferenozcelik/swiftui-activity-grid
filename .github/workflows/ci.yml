name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  macos:
    name: macOS (swift test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: iOS Simulator (xcodebuild test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          xcodebuild test \
            -workspace SwiftUIActivityGrid.xcworkspace \
            -scheme SwiftUIActivityGrid \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'

  example:
    name: Example app (iOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build \
            -workspace SwiftUIActivityGrid.xcworkspace \
            -scheme ActivityGridExample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
