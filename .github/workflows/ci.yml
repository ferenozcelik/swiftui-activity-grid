name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  macos:
    name: macOS (swift test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: iOS Simulator (xcodebuild test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          # Use whichever iPhone simulator the runner image has, so a new image doesn't break this.
          DEVICE=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcodebuild test \
            -workspace SwiftUIActivityGrid.xcworkspace \
            -scheme SwiftUIActivityGrid \
            -destination "id=$DEVICE"

  example:
    name: Example app (iOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build \
            -workspace SwiftUIActivityGrid.xcworkspace \
            -scheme ActivityGridExample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
